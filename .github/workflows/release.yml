name: Build Release
run-name: Release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，例如 0.2.0 或 v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          version="${RELEASE_VERSION#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::版本号必须为 X.Y.Z 或 vX.Y.Z，例如 0.2.0。"
            exit 1
          fi
          tag="v$version"
          existing_tag=$(git ls-remote --tags origin "refs/tags/$tag")
          if [[ -n "$existing_tag" ]]; then
            echo "::error::标签 $tag 已存在，请使用新的版本号。"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_PLATFORM: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxcursor-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set build version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path("Cargo.toml")
          content, count = re.subn(
              r'(?m)^version\s*=\s*"[^"]+"',
              f'version = "{os.environ["RELEASE_VERSION"]}"',
              manifest.read_text(),
              count=1,
          )
          assert count == 1, "Cargo.toml package version was not found"
          manifest.write_text(content)
          PY

      - name: Build binary with embedded ROMs
        run: cargo build --release --bin space-invaders-8080 --target "$BUILD_TARGET"

      - name: Package binary
        run: |
          python - <<'PY'
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          app = "space-invaders-8080"
          windows = os.environ["RUNNER_OS"] == "Windows"
          filename = app + (".exe" if windows else "")
          binary = Path("target") / os.environ["BUILD_TARGET"] / "release" / filename
          assert binary.is_file(), f"Missing binary: {binary}"
          output = Path("dist")
          output.mkdir()
          name = f'{app}-{os.environ["RELEASE_TAG"]}-{os.environ["BUILD_PLATFORM"]}'
          if windows:
              with zipfile.ZipFile(output / f"{name}.zip", "w", zipfile.ZIP_DEFLATED) as archive:
                  archive.write(binary, arcname=filename)
          else:
              with tarfile.open(output / f"{name}.tar.gz", "w:gz") as archive:
                  archive.add(binary, arcname=filename)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  release:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum *.zip *.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --draft
          gh release edit "$RELEASE_TAG" --draft=false
